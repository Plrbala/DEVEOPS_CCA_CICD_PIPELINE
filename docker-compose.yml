services:
  db:
    image: mysql:8.0
    env:
      MYSQL_ROOT_PASSWORD: Admin@123
    ports:
      - 3306:3306
    options: >-
      --health-cmd="mysqladmin ping -h localhost -u root -pAdmin@123"
      --health-interval=5s
      --health-timeout=5s
      --health-retries=10

steps:
  - uses: actions/checkout@v4
  - uses: actions/setup-python@v5
    with:
      python-version: '3.11'
  - name: Install dependencies
    run: pip install -r requirements.txt
  - name: Load seed data
    run: mysql -h 127.0.0.1 -u root -pAdmin@123 < Dump.sql
  - name: Run tests
    run: python MyProject/manage.py test bankapp
    env:
      DB_NAME: db_cca_bank
      DB_USER: root
      DB_PASSWORD: Admin@123
      DB_HOST: 127.0.0.1
      DB_PORT: 3306